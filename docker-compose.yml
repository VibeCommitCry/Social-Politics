services:

    backend:
        build:
            context: ./Backend
            dockerfile: dockerfile
            target: development 
        volumes:
            - ./Backend:/var/www/html
        environment:
            - APP_DEBUG=1
            - DATABASE_URL=mysql://user:secret@db:3306/politiconnect?serverVersion=8.0&charset=utf8mb4
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: [ "CMD", "php-fpm", "-t" ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s
        networks:
            - Social-Politics


    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./Backend:/var/www/html
            - ./Docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - Social-Politics

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: politiconnect
            MYSQL_USER: user
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        volumes:
            - db_data:/var/lib/mysql
            - ./Docker/mysql:/docker-entrypoint-initdb.d:ro
        ports:
            - "3308:3306"
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        networks:
            - Social-Politics

networks:
    Social-Politics:

volumes:
    db_data:
