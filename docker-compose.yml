services:
    backend:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        volumes:
            - ./Backend:/var/www/html
        environment:
            - APP_DEBUG=1
        command: sh -c "composer install && php-fpm"
        healthcheck:
            test: [ "CMD", "php-fpm", "-t" ] # just validates config; see note below
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s
        networks:
            - Social-Politics

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./Backend:/var/www/html
            - ./Docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - Social-Politics

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: politiconnect
            MYSQL_USER: user
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3308:3306"
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - Social-Politics

networks:
    Social-Politics:

volumes:
    db_data:
