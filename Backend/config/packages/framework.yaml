# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true
    http_client:
        scoped_clients:
            goverment_odata_api.client:
                base_uri: '%env(GOVERMENT_API_ODATA_URL)%'

            goverment_syncfeed_api.client:
                base_uri: '%env(GOVERMENT_API_SYNCFEED_URL)%'
when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
