services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $governmentApiSyncfeedUrl: '%env(GOVERMENT_API_SYNCFEED_URL)%'
            string $governmentApiOdataUrl: '%env(GOVERMENT_API_ODATA_URL)%'

    App\:
        resource: '../src/'

    App\Api\Odata\Provider\ApiProvider:
        arguments:
            $governmentApiOdataUrl: '@goverment_odata_api.client'

    App\Interface\OdataInterface: '@App\Api\Odata\Provider\ApiProvider'

    App\Api\SyncFeed\Provider\XmlProvider:
        arguments:
            $governmentApiSyncFeedUrl: '@goverment_syncfeed_api.client'

    App\Interface\SyncFeedInterface: '@App\Api\SyncFeed\Provider\XmlProvider'

    