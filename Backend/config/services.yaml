services:

    app.sync_since:
            class: DateTimeImmutable
            arguments: ['%env(SYNC_SINCE)%']
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $governmentApiOdataUrl: '%env(GOVERMENT_API_ODATA_URL)%'

    App\:
        resource: '../src/'

    App\Api\Odata\Provider\ApiProvider:
        arguments:
            $governmentApiOdataUrl: '@goverment_odata_api.client'

    App\Interface\OdataInterface: '@App\Api\Odata\Provider\ApiProvider'


    App\Command\:
        resource: '../src/Command'
        bind:
             $since: '@app.sync_since'
            # int $recheck: '%env(int:SYNC_RECHECK_DAYS)%'
    