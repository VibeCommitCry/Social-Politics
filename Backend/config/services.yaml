services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $governmentApiSyncfeedUrl: '%env(GOVERMENT_API_SYNCFEED_URL)%'
            string $governmentApiOdataUrl: '%env(GOVERMENT_API_ODATA_URL)%'

    App\:
        resource: '../src/'

    App\Api\Provider\ApiProvider:
        arguments:
            $governmentApiOdataUrl: '@goverment_api.client'

    App\Api\Provider\ApiInterface: '@App\Api\Provider\ApiProvider'